<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:'PT Serif';font-weight:400;src:url(../fonts/ptserif-400-cyrillic.woff2)}
@font-face{font-family:'PT Serif';font-weight:700;src:url(../fonts/ptserif-700-cyrillic.woff2)}
html,body{margin:0}
body{width:640px;height:360px;position:relative;overflow:hidden;background:#0f0e0c;color:#f3ede3;font-family:'PT Serif',Georgia,serif}
.art{position:absolute;right:0;top:0;width:300px;height:360px;object-fit:cover;object-position:50% 30%}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#0f0e0c 48%,rgba(15,14,12,.7) 62%,rgba(15,14,12,0) 85%)}
.txt{position:absolute;left:44px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:330px}
h1{font-size:58px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
p{font-size:23px;line-height:1.3;margin:0 0 22px}
small{font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:14px;color:#d4a75c;letter-spacing:.06em;text-transform:uppercase}
</style>
<img class="art" src="../img/christ-rembrandt.jpg"><div class="fade"></div>
<div class="txt"><h1>Свиток</h1><p>Библия, которую<br>хочется листать</p><small>Бесплатно · без рекламы</small></div>
